<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" type="text/css" href="/css/style.css" />
    <script src="/js/color.js" defer></script>
    <script src="/js/functiones.js" defer></script>
  </head>
  <body>
    <form>
      <input type="text" class="text" placeholder="rrr,ggg,bbb" />
      <p class="error">
        debe escribir tres numeros entre 0 y 255 separados por comas!
      </p>
      <input type="submit" value="crear color" />
    </form>
    <ul></ul>
    <div class="modal-borrar">
      <div>
        <p>¿Estás seguro de que quieres borrar este color?</p>
        <button class="btn-aceptar">Aceptar</button>
        <button class="btn-cancelar">Cancelar</button>
      </div>
    </div>
    <div class="modal-editar">
      <div>
        <div class="color"></div>
        <input type="range" min="0" max="255" value="0" class="slider" id="r" />
        <input type="range" min="0" max="255" value="0" class="slider" id="g" />
        <input type="range" min="0" max="255" value="0" class="slider" id="b" />
        <button class="btn-editar">Aceptar</button>
        <button class="btn-edit-cancel">Cancelar</button>
      </div>
    </div>
  </body>
</html>
